<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 编辑器</title>
    
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
    
    <!-- highlight.js for code highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <!-- KaTeX for math rendering -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
    
    <!-- html2pdf for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #fafafa;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f5f5f5;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a68;
            --text-muted: #8888a0;
            --border-color: #e8e8f0;
            --accent-color: #4a6fa5;
            --accent-hover: #3d5d8a;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --radius-sm: 6px;
            --radius-md: 10px;
            --transition: 0.2s ease;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }
        
        /* Header */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-color), #6b8cba);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }
        
        .logo-text {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .toolbar {
            display: flex;
            gap: 8px;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
        }
        
        .btn:hover {
            background: var(--bg-tertiary);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }
        
        .btn-primary {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            color: white;
        }
        
        .btn svg {
            width: 16px;
            height: 16px;
        }
        
        /* Main Container */
        .container {
            display: flex;
            height: calc(100vh - 57px);
        }
        
        /* Editor Panel */
        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }
        
        .panel-header {
            padding: 10px 16px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .panel-header svg {
            width: 14px;
            height: 14px;
        }
        
        .editor-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        
        .line-numbers {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 50px;
            background: var(--bg-tertiary);
            border-right: 1px solid var(--border-color);
            padding: 16px 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.7;
            color: var(--text-muted);
            text-align: right;
            overflow: hidden;
            user-select: none;
        }
        
        .line-number {
            padding-right: 12px;
            height: 22.1px;
        }
        
        #editor {
            position: absolute;
            left: 50px;
            top: 0;
            right: 0;
            bottom: 0;
            padding: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.7;
            border: none;
            outline: none;
            resize: none;
            background: var(--bg-secondary);
            color: var(--text-primary);
            tab-size: 4;
        }
        
        #editor::placeholder {
            color: var(--text-muted);
        }
        
        /* Preview Panel */
        .preview-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
        }
        
        .preview-wrapper {
            flex: 1;
            overflow: auto;
            padding: 24px 32px;
        }
        
        /* Markdown Styles */
        .markdown-body {
            font-family: 'Noto Serif SC', Georgia, serif;
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-primary);
            max-width: 800px;
            margin: 0 auto;
        }
        
        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4,
        .markdown-body h5,
        .markdown-body h6 {
            font-family: 'Noto Sans SC', sans-serif;
            font-weight: 600;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            line-height: 1.4;
            color: var(--text-primary);
        }
        
        .markdown-body h1 {
            font-size: 2em;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.3em;
        }
        
        .markdown-body h2 {
            font-size: 1.6em;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.2em;
        }
        
        .markdown-body h3 { font-size: 1.35em; }
        .markdown-body h4 { font-size: 1.15em; }
        .markdown-body h5 { font-size: 1em; }
        .markdown-body h6 { font-size: 0.9em; color: var(--text-secondary); }
        
        .markdown-body p {
            margin-bottom: 1em;
        }
        
        .markdown-body a {
            color: var(--accent-color);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color var(--transition);
        }
        
        .markdown-body a:hover {
            border-bottom-color: var(--accent-color);
        }
        
        .markdown-body strong {
            font-weight: 600;
        }
        
        .markdown-body em {
            font-style: italic;
        }
        
        .markdown-body code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9em;
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
            color: #c7254e;
        }
        
        .markdown-body pre {
            background: #f8f9fa;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 16px;
            overflow-x: auto;
            margin: 1em 0;
        }
        
        .markdown-body pre code {
            background: transparent;
            padding: 0;
            color: inherit;
            font-size: 13px;
            line-height: 1.6;
        }
        
        .markdown-body blockquote {
            border-left: 4px solid var(--accent-color);
            padding-left: 16px;
            margin: 1em 0;
            color: var(--text-secondary);
            font-style: italic;
        }
        
        .markdown-body ul,
        .markdown-body ol {
            padding-left: 2em;
            margin: 1em 0;
        }
        
        .markdown-body li {
            margin: 0.3em 0;
        }
        
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 1em 0;
        }
        
        .markdown-body th,
        .markdown-body td {
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            text-align: left;
        }
        
        .markdown-body th {
            background: var(--bg-tertiary);
            font-weight: 600;
        }
        
        .markdown-body tr:nth-child(even) {
            background: var(--bg-tertiary);
        }
        
        .markdown-body img {
            max-width: 100%;
            border-radius: var(--radius-md);
            margin: 1em 0;
        }
        
        .markdown-body hr {
            border: none;
            border-top: 2px solid var(--border-color);
            margin: 2em 0;
        }
        
        /* Task lists */
        .markdown-body input[type="checkbox"] {
            margin-right: 8px;
        }
        
        /* Math blocks */
        .markdown-body .katex-display {
            margin: 1.5em 0;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 8px 0;
        }
        
        .markdown-body .katex {
            font-size: 1.1em;
        }
        
        /* Fullscreen Mode */
        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-secondary);
            z-index: 1000;
            display: none;
            flex-direction: column;
        }
        
        .fullscreen-overlay.active {
            display: flex;
        }
        
        .fullscreen-header {
            padding: 12px 24px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .fullscreen-content {
            flex: 1;
            overflow: auto;
            padding: 40px;
        }
        
        .fullscreen-content .markdown-body {
            max-width: 900px;
        }
        
        /* Sync indicator */
        .sync-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-muted);
            padding: 4px 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
        }
        
        .sync-dot {
            width: 6px;
            height: 6px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
        }
        
        ::-webkit-scrollbar-thumb {
            background: #c8c8d4;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8b4;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .editor-panel,
            .preview-panel {
                flex: none;
                height: 50%;
            }
            
            .editor-panel {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
            
            .toolbar .btn span {
                display: none;
            }
            
            .toolbar .btn {
                padding: 8px;
            }
        }
        
        /* Print styles for PDF */
        @media print {
            .header, .editor-panel, .panel-header {
                display: none !important;
            }
            
            .container {
                display: block;
            }
            
            .preview-panel {
                width: 100%;
            }
            
            .preview-wrapper {
                padding: 0;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <div class="logo-icon">M</div>
            <span class="logo-text">Markdown 编辑器</span>
        </div>
        
        <div class="toolbar">
            <div class="sync-indicator">
                <span class="sync-dot"></span>
                <span>同步滚动已启用</span>
            </div>
            <div class="sync-indicator">
                <span class="sync-dot"></span>
                <a href='latex.html'>latex工具</span>
            </div>
            <button class="btn" onclick="toggleFullscreen()" title="全屏预览">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                </svg>
                <span>全屏</span>
            </button>
            
            <button class="btn btn-primary" onclick="exportPDF()" title="导出 PDF">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                <span>导出 PDF</span>
            </button>
        </div>
    </header>
    
    <main class="container">
        <div class="editor-panel">
            <div class="panel-header">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
                Markdown 源码
            </div>
            <div class="editor-wrapper">
                <div class="line-numbers" id="lineNumbers"></div>
                <textarea id="editor" placeholder="在此输入 Markdown 内容...

支持的语法：
- 标题：# ## ### 
- 粗体：**text**
- 斜体：*text*
- 代码：`code` 或 ```代码块```
- 链接：[text](url)
- 图片：![alt](url)
- 列表：- item 或 1. item
- 引用：> quote
- 表格：| col1 | col2 |
- 任务列表：- [ ] task
- 行内公式：$E = mc^2$
- 块级公式：$$\int_a^b f(x)dx$$"></textarea>
            </div>
        </div>
        
        <div class="preview-panel">
            <div class="panel-header">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                预览
            </div>
            <div class="preview-wrapper" id="previewWrapper">
                <div class="markdown-body" id="preview"></div>
            </div>
        </div>
    </main>
    
    <!-- Fullscreen Overlay -->
    <div class="fullscreen-overlay" id="fullscreenOverlay">
        <div class="fullscreen-header">
            <div class="logo">
                <div class="logo-icon">M</div>
                <span class="logo-text">全屏预览</span>
            </div>
            <button class="btn" onclick="toggleFullscreen()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
                <span>退出全屏</span>
            </button>
        </div>
        <div class="fullscreen-content">
            <div class="markdown-body" id="fullscreenPreview"></div>
        </div>
    </div>
    
    <script>
        // DOM Elements
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const previewWrapper = document.getElementById('previewWrapper');
        const lineNumbers = document.getElementById('lineNumbers');
        const fullscreenOverlay = document.getElementById('fullscreenOverlay');
        const fullscreenPreview = document.getElementById('fullscreenPreview');
        
        // Scroll sync state
        let isEditorScrolling = false;
        let isPreviewScrolling = false;
        let scrollTimeout = null;
        
        // Configure marked
        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try {
                        return hljs.highlight(code, { language: lang }).value;
                    } catch (e) {}
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true,
            gfm: true
        });
        
        // Custom renderer for better handling
        const renderer = new marked.Renderer();
        
        // Add data attributes for sync scrolling
        let blockIndex = 0;
        
        renderer.heading = function(text, level) {
            const index = blockIndex++;
            return `<h${level} data-source-line="${index}">${text}</h${level}>`;
        };
        
        renderer.paragraph = function(text) {
            const index = blockIndex++;
            return `<p data-source-line="${index}">${text}</p>`;
        };
        
        renderer.list = function(body, ordered, start) {
            const index = blockIndex++;
            const type = ordered ? 'ol' : 'ul';
            const startAttr = ordered && start !== 1 ? ` start="${start}"` : '';
            return `<${type}${startAttr} data-source-line="${index}">${body}</${type}>`;
        };
        
        renderer.blockquote = function(quote) {
            const index = blockIndex++;
            return `<blockquote data-source-line="${index}">${quote}</blockquote>`;
        };
        
        renderer.code = function(code, language) {
            const index = blockIndex++;
            const validLang = language && hljs.getLanguage(language) ? language : '';
            const highlighted = validLang 
                ? hljs.highlight(code, { language: validLang }).value 
                : hljs.highlightAuto(code).value;
            return `<pre data-source-line="${index}"><code class="hljs ${validLang}">${highlighted}</code></pre>`;
        };
        
        renderer.table = function(header, body) {
            const index = blockIndex++;
            return `<table data-source-line="${index}"><thead>${header}</thead><tbody>${body}</tbody></table>`;
        };
        
        renderer.hr = function() {
            const index = blockIndex++;
            return `<hr data-source-line="${index}">`;
        };
        
        marked.use({ renderer });
        
        // Process math before markdown
        function processMath(text) {
            // Store math blocks to prevent markdown processing
            const mathBlocks = [];
            let mathIndex = 0;
            
            // Block math: $$...$$
            text = text.replace(/\$\$([\s\S]*?)\$\$/g, (match, math) => {
                const placeholder = `%%MATHBLOCK${mathIndex}%%`;
                mathBlocks.push({ placeholder, math: math.trim(), display: true });
                mathIndex++;
                return placeholder;
            });
            
            // Inline math: $...$
            text = text.replace(/\$([^\$\n]+?)\$/g, (match, math) => {
                const placeholder = `%%MATHINLINE${mathIndex}%%`;
                mathBlocks.push({ placeholder, math: math.trim(), display: false });
                mathIndex++;
                return placeholder;
            });
            
            return { text, mathBlocks };
        }
        
        // Restore math after markdown processing
        function restoreMath(html, mathBlocks) {
            mathBlocks.forEach(({ placeholder, math, display }) => {
                try {
                    const rendered = katex.renderToString(math, {
                        displayMode: display,
                        throwOnError: false,
                        trust: true
                    });
                    html = html.replace(placeholder, rendered);
                } catch (e) {
                    html = html.replace(placeholder, `<span class="math-error">${math}</span>`);
                }
            });
            return html;
        }
        
        // Render markdown
        function renderMarkdown() {
            blockIndex = 0;
            const text = editor.value;
            
            // Process math first
            const { text: processedText, mathBlocks } = processMath(text);
            
            // Convert markdown
            let html = marked.parse(processedText);
            
            // Restore math
            html = restoreMath(html, mathBlocks);
            
            preview.innerHTML = html;
            fullscreenPreview.innerHTML = html;
            
            updateLineNumbers();
        }
        
        // Update line numbers
        function updateLineNumbers() {
            const lines = editor.value.split('\n');
            const lineCount = lines.length;
            
            let numbersHtml = '';
            for (let i = 1; i <= lineCount; i++) {
                numbersHtml += `<div class="line-number">${i}</div>`;
            }
            lineNumbers.innerHTML = numbersHtml;
        }
        
        // Sync scroll from editor to preview
        function syncEditorToPreview() {
            if (isPreviewScrolling) return;
            
            isEditorScrolling = true;
            clearTimeout(scrollTimeout);
            
            const editorScrollRatio = editor.scrollTop / (editor.scrollHeight - editor.clientHeight);
            const previewMaxScroll = previewWrapper.scrollHeight - previewWrapper.clientHeight;
            
            previewWrapper.scrollTop = editorScrollRatio * previewMaxScroll;
            lineNumbers.scrollTop = editor.scrollTop;
            
            scrollTimeout = setTimeout(() => {
                isEditorScrolling = false;
            }, 100);
        }
        
        // Sync scroll from preview to editor
        function syncPreviewToEditor() {
            if (isEditorScrolling) return;
            
            isPreviewScrolling = true;
            clearTimeout(scrollTimeout);
            
            const previewScrollRatio = previewWrapper.scrollTop / (previewWrapper.scrollHeight - previewWrapper.clientHeight);
            const editorMaxScroll = editor.scrollHeight - editor.clientHeight;
            
            editor.scrollTop = previewScrollRatio * editorMaxScroll;
            lineNumbers.scrollTop = editor.scrollTop;
            
            scrollTimeout = setTimeout(() => {
                isPreviewScrolling = false;
            }, 100);
        }
        
        // Toggle fullscreen
        function toggleFullscreen() {
            fullscreenOverlay.classList.toggle('active');
            
            if (fullscreenOverlay.classList.contains('active')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = '';
            }
        }
        
        // Export to PDF
        async function exportPDF() {
            const content = preview.cloneNode(true);
            
            const container = document.createElement('div');
            container.style.padding = '40px';
            container.style.fontFamily = "'Noto Serif SC', Georgia, serif";
            container.style.fontSize = '14px';
            container.style.lineHeight = '1.8';
            container.style.color = '#1a1a2e';
            container.appendChild(content);
            
            const opt = {
                margin: [15, 15, 15, 15],
                filename: 'markdown-export.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { 
                    scale: 2,
                    useCORS: true,
                    letterRendering: true
                },
                jsPDF: { 
                    unit: 'mm', 
                    format: 'a4', 
                    orientation: 'portrait' 
                },
                pagebreak: { mode: 'avoid-all' }
            };
            
            try {
                await html2pdf().set(opt).from(container).save();
            } catch (e) {
                console.error('PDF export failed:', e);
                alert('PDF 导出失败，请重试');
            }
        }
        
        // Handle Tab key in editor
        editor.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                
                this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
                
                renderMarkdown();
            }
        });
        
        // Event listeners
        editor.addEventListener('input', renderMarkdown);
        editor.addEventListener('scroll', syncEditorToPreview);
        previewWrapper.addEventListener('scroll', syncPreviewToEditor);
        
        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            // Escape to exit fullscreen
            if (e.key === 'Escape' && fullscreenOverlay.classList.contains('active')) {
                toggleFullscreen();
            }
            
            // Ctrl/Cmd + S to export PDF
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                exportPDF();
            }
            
            // F11 for fullscreen
            if (e.key === 'F11') {
                e.preventDefault();
                toggleFullscreen();
            }
        });

def quicksort(arr):
    if len(arr) <= 1:
        return arr
    pivot = arr[len(arr) // 2]
    left = [x for x in arr if x < pivot]
    middle = [x for x in arr if x == pivot]
    right = [x for x in arr if x > pivot]
    return quicksort(left) + middle + quicksort(right)
